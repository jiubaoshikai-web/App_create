<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモタスク">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>メモ＆タスク</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--accent:#ff9f0a;--blue:#0a84ff;--red:#ff3b30;--green:#34c759}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#38383a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:28px}
main{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--sub)}
nav button .i{display:block;font-size:22px}
nav button.on{color:var(--accent)}
.btn{border:0;background:none;color:var(--accent);font-size:16px;padding:8px 4px}
.btn.fill{background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px}
.btn.red{color:var(--red)}
.card{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .s{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],textarea{width:100%;border:0;background:var(--card);color:var(--text);font:inherit;padding:12px 14px;border-radius:12px;outline:none}
textarea{min-height:180px;resize:vertical;display:block}
.row{display:flex;gap:8px;margin-bottom:10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--sub);flex:none;margin-top:1px;background:none;padding:0;color:#fff;font-size:15px;line-height:1}
.chk.on{background:var(--green);border-color:var(--green)}
.done .t{text-decoration:line-through;color:var(--sub)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs div{position:relative}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:14px;line-height:1;padding:0}
.mini{display:inline-flex;gap:3px;margin-top:4px}
.mini img{width:32px;height:32px;border-radius:6px;object-fit:cover}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.tag{font-size:12px;color:var(--blue)}
.late{color:var(--red)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{border:0;background:var(--card);color:var(--text);padding:6px 12px;border-radius:16px;font-size:14px}
.seg.on{background:var(--accent);color:#fff}
#viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9}
#viewer img{max-width:100%;max-height:100%}
.hidden{display:none!important}
#sum{display:flex;gap:8px;padding:0 16px 10px}
#sum div{flex:1;background:var(--card);border-radius:12px;padding:8px 10px}
#sum b{font-size:24px;display:block;line-height:1.2}
#sum span{font-size:11px;color:var(--sub)}
#sum .warn b{color:var(--red)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:8}
#modal .box{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90dvh;overflow-y:auto}
#modal label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.thumbs img.sel{outline:3px solid var(--green);outline-offset:-3px}
.thumbs img.off{opacity:.35}
.tphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tphotos img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.cnt{font-size:13px;color:var(--sub);margin:-4px 0 8px}
.thumbs .cntbtn{position:absolute;left:4px;bottom:4px;border:0;border-radius:8px;background:#000a;color:#fff;font-size:13px;padding:2px 8px}
#cv{width:100%;border-radius:10px;display:block;background:#000}
.crow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.crow.off{opacity:.4}
.crow .nm{flex:1}
.crow .n{min-width:44px;text-align:center;font-weight:700;font-size:18px}
.crow button{width:30px;height:30px;border-radius:50%;border:0;background:var(--card);color:var(--text);font-size:18px;padding:0}
.total{font-size:20px;font-weight:700;margin:10px 0 2px}
.badge{font-size:12px;color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">メモ</h1><div id="hbtn"></div></header>
  <div id="sum"></div>
  <main id="main"></main>
  <nav>
    <button data-tab="memos"><span class="i">📝</span>メモ</button>
    <button data-tab="tasks"><span class="i">✅</span>タスク</button>
    <button data-tab="more"><span class="i">⚙️</span>その他</button>
  </nav>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="viewer"><img alt=""></div>
<input type="file" id="fcam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="flib" accept="image/*" multiple class="hidden">
<input type="file" id="fimp" accept="application/json" class="hidden">
<script>
// ---------- IndexedDB ----------
let db;
const open = () => new Promise((res, rej) => {
  const r = indexedDB.open('memo-task', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('memos', {keyPath:'id'}); r.result.createObjectStore('tasks', {keyPath:'id'}); };
  r.onsuccess = () => { db = r.result; res(); };
  r.onerror = () => rej(r.error);
});
const tx = (s, m, f) => new Promise((res, rej) => {
  const t = db.transaction(s, m), o = t.objectStore(s), q = f(o);
  t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
});
const all = s => tx(s, 'readonly', o => o.getAll());
const put = (s, v) => tx(s, 'readwrite', o => o.put(v));
const del = (s, id) => tx(s, 'readwrite', o => o.delete(id));
const shots = () => { try { return +localStorage.getItem('shots') || 0; } catch { return 0; } };
const addShots = n => { try { localStorage.setItem('shots', shots() + n); } catch {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- state ----------
let tab = 'memos', memos = [], tasks = [], editing = null, filter = 'open';
const $ = id => document.getElementById(id);
const main = $('main'), hbtn = $('hbtn'), title = $('title');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmt = t => new Date(t).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});

async function load() { memos = (await all('memos')).sort((a,b) => b.updated - a.updated); tasks = await all('tasks'); }

// ---------- image ----------
function resize(file, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function viewImg(src) { const v = $('viewer'); v.firstElementChild.src = src; v.style.display = 'flex'; }
$('viewer').onclick = () => $('viewer').style.display = 'none';

// ---------- object counting (on-device COCO-SSD) ----------
const JA = {person:'人',bicycle:'自転車',car:'車',motorcycle:'バイク',airplane:'飛行機',bus:'バス',train:'電車',truck:'トラック',boat:'ボート','traffic light':'信号機','fire hydrant':'消火栓','stop sign':'一時停止標識','parking meter':'パーキングメーター',bench:'ベンチ',bird:'鳥',cat:'猫',dog:'犬',horse:'馬',sheep:'羊',cow:'牛',elephant:'象',bear:'クマ',zebra:'シマウマ',giraffe:'キリン',backpack:'リュック',umbrella:'傘',handbag:'ハンドバッグ',tie:'ネクタイ',suitcase:'スーツケース',frisbee:'フリスビー',skis:'スキー板',snowboard:'スノーボード','sports ball':'ボール',kite:'凧','baseball bat':'バット','baseball glove':'グローブ',skateboard:'スケボー',surfboard:'サーフボード','tennis racket':'ラケット',bottle:'ボトル','wine glass':'ワイングラス',cup:'カップ',fork:'フォーク',knife:'ナイフ',spoon:'スプーン',bowl:'ボウル',banana:'バナナ',apple:'りんご',sandwich:'サンドイッチ',orange:'オレンジ',broccoli:'ブロッコリー',carrot:'にんじん','hot dog':'ホットドッグ',pizza:'ピザ',donut:'ドーナツ',cake:'ケーキ',chair:'椅子',couch:'ソファ','potted plant':'鉢植え',bed:'ベッド','dining table':'テーブル',toilet:'トイレ',tv:'テレビ',laptop:'ノートPC',mouse:'マウス',remote:'リモコン',keyboard:'キーボード','cell phone':'スマホ',microwave:'電子レンジ',oven:'オーブン',toaster:'トースター',sink:'シンク',refrigerator:'冷蔵庫',book:'本',clock:'時計',vase:'花瓶',scissors:'はさみ','teddy bear':'ぬいぐるみ','hair drier':'ドライヤー',toothbrush:'歯ブラシ'};
let detector = null;
const loadScript = src => new Promise((res, rej) => { const e = document.createElement('script'); e.src = src; e.onload = res; e.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(e); });
async function getDetector() {
  if (detector) return detector;
  if (!window.tf) await loadScript('lib/tf.min.js');
  if (!window.cocoSsd) await loadScript('lib/coco-ssd.min.js');
  detector = await cocoSsd.load({modelUrl: 'lib/model/model.json'});
  return detector;
}
async function countModal(m, idx, onDone) {
  const box = $('mbox'), close = () => $('modal').style.display = 'none';
  $('modal').style.display = 'flex';
  box.innerHTML = '<h3 style="margin:0 0 8px">写真のものを数える</h3><div class="empty" id="cst">モデルを読み込み中…（初回のみ少し時間がかかります）</div><div class="row"><button class="btn" id="cc">閉じる</button></div>';
  $('cc').onclick = close;
  let dets;
  const img = new Image();
  try {
    img.src = m.photos[idx]; await img.decode();
    const d = await getDetector();
    $('cst').textContent = '解析中…';
    dets = await d.detect(img, 100, 0.2);
  } catch (err) { $('cst').textContent = '解析に失敗しました。通信状態を確認して、もう一度お試しください。'; return; }
  let thr = 0.5; const off = new Set(), adj = {};
  box.innerHTML = `<h3 style="margin:0 0 8px">写真のものを数える</h3>
    <canvas id="cv"></canvas>
    <label style="display:block;font-size:13px;color:var(--sub);margin-top:8px">検出の感度（右ほどたくさん検出・誤検出も増えます）</label>
    <input type="range" id="sl" min="20" max="90" value="${100 - thr * 100 + 20}" style="width:100%">
    <div class="total" id="tot"></div>
    <div id="cl"></div>
    <p style="font-size:12px;color:var(--sub);margin:6px 0">AIの推定なので誤りがあります。−/＋で数を直せます。行をタップで集計から除外できます。</p>
    <div class="row"><button class="btn fill" id="ins" style="flex:1;background:var(--green)">メモに追記</button><button class="btn" id="cc">閉じる</button></div>`;
  const cv = $('cv');
  const draw = () => {
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
    g.lineWidth = Math.max(2, cv.width / 250); g.font = `bold ${Math.max(14, cv.width / 40)}px sans-serif`;
    cur().forEach(d => { if (off.has(d.class)) return;
      const [x, y, w, h] = d.bbox; g.strokeStyle = '#ff9f0a'; g.strokeRect(x, y, w, h);
      g.fillStyle = '#ff9f0a'; g.fillText(JA[d.class] || d.class, x + 3, y + parseInt(g.font) + 1); });
  };
  const cur = () => dets.filter(d => d.score >= thr);
  const groups = () => { const o = {}; cur().forEach(d => o[d.class] = (o[d.class] || 0) + 1);
    Object.keys(adj).forEach(k => { o[k] = Math.max(0, (o[k] || 0) + adj[k]); }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const list = () => {
    const g = groups(), total = g.filter(([k]) => !off.has(k)).reduce((a, [, n]) => a + n, 0);
    $('tot').textContent = `合計 ${total}個`;
    $('cl').innerHTML = g.length ? g.map(([k, n]) => `<div class="crow ${off.has(k) ? 'off' : ''}"><span class="nm" data-t="${k}">${JA[k] || k}</span><button data-a="${k}:-1">−</button><span class="n">${n}</span><button data-a="${k}:1">＋</button></div>`).join('') : '<div class="empty" style="padding:14px">何も検出できませんでした。感度を上げてみてください。</div>';
    $('cl').querySelectorAll('[data-t]').forEach(e => e.onclick = () => { off.has(e.dataset.t) ? off.delete(e.dataset.t) : off.add(e.dataset.t); list(); draw(); });
    $('cl').querySelectorAll('[data-a]').forEach(e => e.onclick = () => { const [k, v] = e.dataset.a.split(':'); adj[k] = (adj[k] || 0) + +v; list(); });
  };
  $('sl').oninput = e => { thr = (120 - +e.target.value) / 100; list(); draw(); };
  $('cc').onclick = close;
  $('ins').onclick = () => {
    const g = groups().filter(([k, n]) => !off.has(k) && n > 0);
    if (!g.length) return;
    const line = `📷写真${idx + 1}: ` + g.map(([k, n]) => `${JA[k] || k}${n}`).join('、') + `（合計${g.reduce((a, [, n]) => a + n, 0)}）`;
    const ta = $('mb'); ta.value = (ta.value && !ta.value.endsWith('\n') ? ta.value + '\n' : ta.value) + line;
    m.body = ta.value; close(); if (onDone) onDone();
  };
  list(); draw();
}

// ---------- render ----------
function summary() {
  const open = tasks.filter(t => !t.done);
  const due = open.filter(t => t.due && t.due <= today()).length;
  const el = $('sum');
  el.classList.toggle('hidden', !!editing);
  el.innerHTML = `<div class="${due ? 'warn' : ''}"><b>${due}</b><span>今日までの未完了</span></div>
    <div><b>${open.length}</b><span>未完了</span></div>
    <div><b>${tasks.length}</b><span>タスク総数</span></div>
    <div><b>${shots()}</b><span>📷 撮影数</span></div>`;
}

function render() {
  summary();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (editing) return renderEditor();
  if (tab === 'memos') renderMemos();
  else if (tab === 'tasks') renderTasks();
  else renderMore();
}

function renderMemos() {
  title.textContent = 'メモ';
  hbtn.innerHTML = '<button class="btn" id="new">＋ 新規</button>';
  $('new').onclick = () => { editing = {id: uid(), title:'', body:'', photos:[], created: Date.now(), updated: Date.now(), isNew:true}; render(); };
  let h = '<div class="row"><input type="text" id="q" placeholder="検索"></div>';
  h += '<div class="card" id="list"></div>';
  main.innerHTML = h;
  const draw = () => {
    const q = $('q').value.toLowerCase();
    const l = memos.filter(m => (m.title + m.body).toLowerCase().includes(q));
    $('list').innerHTML = l.length ? l.map(m => `<div class="item" data-id="${m.id}"><div class="grow">
      <div class="t">${esc(m.title) || '(無題)'} ${tasks.some(t => t.memoId === m.id) ? '<span class="badge">✅ タスクあり</span>' : ''}</div>
      <div class="s">${fmt(m.updated)}　${esc(m.body.split('\n')[0])}</div>
      ${m.photos.length ? '<div class="s">📷 ' + m.photos.length + '枚</div><div class="mini">' + m.photos.slice(0,4).map(p => `<img src="${p}">`).join('') + '</div>' : ''}
    </div></div>`).join('') : '<div class="empty">メモがありません</div>';
    $('list').querySelectorAll('.item').forEach(e => e.onclick = () => { editing = structuredClone(memos.find(m => m.id === e.dataset.id)); render(); });
  };
  $('q').oninput = draw; draw();
}

function renderEditor() {
  const m = editing;
  title.textContent = 'メモ';
  hbtn.innerHTML = '<button class="btn" id="done">完了</button>';
  main.innerHTML = `
    <div class="row"><input type="text" id="mt" placeholder="タイトル" value="${esc(m.title)}"></div>
    <div class="row"><textarea id="mb" placeholder="本文（文字を選択して「タスクに追加」で選択部分だけ追加できます）">${esc(m.body)}</textarea></div>
    <div class="cnt" id="cnt"></div>
    <div class="thumbs" id="th"></div>
    <div class="bar">
      <button class="btn fill" id="cam">📷 撮影</button>
      <button class="btn fill" id="lib" style="background:var(--blue)">🖼 写真を選ぶ</button>
      <button class="btn fill" id="addtask" style="background:var(--green)">✅ タスクに追加</button>
    </div>
    <div id="linked"></div>
    ${m.isNew ? '' : '<button class="btn red" id="rm">このメモを削除</button>'}`;
  const sync = () => { m.title = $('mt').value; m.body = $('mb').value; };
  const thumbs = () => {
    $('cnt').textContent = `📷 このメモの写真 ${m.photos.length}枚　／　累計撮影 ${shots()}枚`;
    $('th').innerHTML = m.photos.map((p,i) => `<div><img src="${p}" data-i="${i}"><button class="x" data-x="${i}">×</button><button class="cntbtn" data-c="${i}">🔢 数える</button></div>`).join('');
    $('th').querySelectorAll('.cntbtn').forEach(e => e.onclick = () => { sync(); countModal(m, +e.dataset.c, thumbs); });
    $('th').querySelectorAll('img').forEach(e => e.onclick = () => viewImg(m.photos[e.dataset.i]));
    $('th').querySelectorAll('.x').forEach(e => e.onclick = () => { sync(); m.photos.splice(+e.dataset.x, 1); thumbs(); });
  };
  const linked = () => {
    const l = tasks.filter(t => t.memoId === m.id);
    $('linked').innerHTML = l.length ? '<div class="tag">このメモから作成したタスク</div><div class="card">' +
      l.map(t => `<div class="item ${t.done?'done':''}"><div class="grow t">${esc(t.title)}${t.due ? ` <span class="s">（期日 ${t.due}）</span>` : ''}</div></div>`).join('') + '</div>' : '';
  };
  thumbs(); linked();
  $('cam').onclick = () => { sync(); $('fcam').click(); };
  $('lib').onclick = () => { sync(); $('flib').click(); };
  const addFiles = async files => {
    for (const f of files) { try { m.photos.push(await resize(f)); } catch { alert('画像を読み込めませんでした'); } }
    thumbs();
  };
  $('fcam').onchange = async e => { const n = e.target.files.length; await addFiles(e.target.files); addShots(n); summary(); thumbs(); e.target.value = ''; };
  $('flib').onchange = async e => { await addFiles(e.target.files); e.target.value = ''; };
  $('addtask').onclick = () => {
    sync();
    const ta = $('mb');
    let text = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
    if (!text) text = m.title.trim() || m.body.split('\n').find(l => l.trim())?.trim() || '';
    if (!text) return alert('タスクにする文字を入力するか、選択してください');
    const sel = new Set(m.photos.map((_, i) => i));
    const box = $('mbox');
    box.innerHTML = `<h3 style="margin:0 0 4px">タスクに追加</h3>
      <label>タスク名</label><input type="text" id="tn" value="${esc(text.slice(0, 100))}">
      <label>期日</label><input type="date" id="td" value="">
      ${m.photos.length ? '<label>添付する写真（タップで選択/解除）</label><div class="thumbs" id="tp"></div>' : ''}
      <div class="row" style="margin-top:14px"><button class="btn fill" id="tok" style="flex:1;background:var(--green)">追加</button><button class="btn" id="tcancel">キャンセル</button></div>`;
    const drawP = () => { const tp = $('tp'); if (!tp) return;
      tp.innerHTML = m.photos.map((p, i) => `<div><img src="${p}" data-i="${i}" class="${sel.has(i) ? 'sel' : 'off'}"></div>`).join('');
      tp.querySelectorAll('img').forEach(e => e.onclick = () => { const i = +e.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); drawP(); }); };
    drawP();
    $('modal').style.display = 'flex';
    const close = () => $('modal').style.display = 'none';
    $('tcancel').onclick = close;
    $('tok').onclick = async () => {
      const name = $('tn').value.trim(); if (!name) return;
      await put('tasks', {id: uid(), title: name, done:false, due: $('td').value, memoId: m.id,
        photos: m.photos.filter((_, i) => sel.has(i)), created: Date.now()});
      tasks = await all('tasks'); close(); linked(); summary();
    };
  };
  $('done').onclick = async () => {
    sync();
    if (m.isNew && !m.title.trim() && !m.body.trim() && !m.photos.length) { editing = null; return render(); }
    delete m.isNew; m.updated = Date.now();
    await put('memos', m); await load(); editing = null; render();
  };
  const rm = $('rm');
  if (rm) rm.onclick = async () => {
    if (!confirm('このメモを削除しますか？')) return;
    await del('memos', m.id); await load(); editing = null; render();
  };
}

function renderTasks() {
  title.textContent = 'タスク';
  hbtn.innerHTML = '';
  const memoOf = id => memos.find(m => m.id === id);
  let h = `<div class="row"><input type="text" id="nt" placeholder="新しいタスクを追加…"><input type="date" id="nd" style="width:auto;flex:none"><button class="btn fill" id="add">追加</button></div>
    <div class="bar">${[['open','未完了'],['today','今日まで'],['done','完了'],['all','すべて']].map(([k,l]) => `<button class="seg ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="card" id="tl"></div>`;
  main.innerHTML = h;
  const add = async () => {
    const v = $('nt').value.trim(); if (!v) return;
    await put('tasks', {id: uid(), title: v, done:false, due: $('nd').value, memoId:null, photos:[], created: Date.now()});
    tasks = await all('tasks'); renderTasks(); summary();
  };
  $('add').onclick = add; $('nt').onkeydown = e => { if (e.key === 'Enter') add(); };
  main.querySelectorAll('.seg').forEach(b => b.onclick = () => { filter = b.dataset.f; renderTasks(); });
  let l = tasks.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done && (filter === 'open' || (t.due && t.due <= today()))));
  l.sort((a,b) => (a.due || '9') .localeCompare(b.due || '9') || a.created - b.created);
  $('tl').innerHTML = l.length ? l.map(t => {
    const m = t.memoId && memoOf(t.memoId);
    return `<div class="item ${t.done?'done':''}" data-id="${t.id}">
      <button class="chk ${t.done?'on':''}" data-c="${t.id}">${t.done?'✓':''}</button>
      <div class="grow"><div class="t">${esc(t.title)}</div>
      <div class="s">${t.due ? `<span class="${!t.done && t.due < today() ? 'late' : ''}">期限 ${t.due}</span>　` : ''}${(t.photos||[]).length ? `📷${t.photos.length}枚　` : ''}${m ? `<span class="tag" data-m="${m.id}">📝 ${esc(m.title) || '(無題)'}</span>` : ''}</div>${(t.photos||[]).length ? '<div class="tphotos">' + t.photos.map((p,i) => `<img src="${p}" data-ti="${t.id}:${i}">`).join('') + '</div>' : ''}</div>
      <input type="date" value="${t.due}" data-d="${t.id}" style="width:auto;padding:4px;font-size:13px">
      <button class="btn red" data-r="${t.id}">🗑</button></div>`;
  }).join('') : '<div class="empty">タスクがありません</div>';
  const upd = async (id, f) => { const t = tasks.find(x => x.id === id); f(t); await put('tasks', t); tasks = await all('tasks'); renderTasks(); summary(); };
  main.querySelectorAll('[data-c]').forEach(e => e.onclick = () => upd(e.dataset.c, t => t.done = !t.done));
  main.querySelectorAll('[data-r]').forEach(e => e.onclick = async () => { if (confirm('削除しますか？')) { await del('tasks', e.dataset.r); tasks = await all('tasks'); renderTasks(); summary(); } });
  main.querySelectorAll('[data-d]').forEach(e => e.onchange = () => upd(e.dataset.d, t => t.due = e.value));
  main.querySelectorAll('[data-ti]').forEach(e => e.onclick = ev => { ev.stopPropagation(); const [id,i] = e.dataset.ti.split(':'); viewImg(tasks.find(x => x.id === id).photos[+i]); });
  main.querySelectorAll('[data-m]').forEach(e => e.onclick = () => { editing = structuredClone(memoOf(e.dataset.m)); tab = 'memos'; render(); });
}

function renderMore() {
  title.textContent = 'その他';
  hbtn.innerHTML = '';
  main.innerHTML = `<div class="card">
    <div class="item"><div class="grow"><div class="t">バックアップを書き出す</div><div class="s">メモ・写真・タスクをファイルに保存</div></div><button class="btn" id="exp">書き出し</button></div>
    <div class="item"><div class="grow"><div class="t">バックアップを読み込む</div><div class="s">現在のデータに追加されます</div></div><button class="btn" id="imp">読み込み</button></div></div>
    <p class="s" style="color:var(--sub);font-size:13px">データはこの端末のSafari内に保存されます。ホーム画面に追加するとアプリのように使えます（共有ボタン →「ホーム画面に追加」）。</p>`;
  $('exp').onclick = async () => {
    const data = JSON.stringify({memos: await all('memos'), tasks: await all('tasks')});
    const f = new File([data], 'memo-task-backup-' + today() + '.json', {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f]}); } catch {} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
  };
  $('imp').onclick = () => $('fimp').click();
  $('fimp').onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      for (const m of d.memos || []) await put('memos', m);
      for (const t of d.tasks || []) await put('tasks', t);
      await load(); alert('読み込みました');
    } catch { alert('読み込めませんでした'); }
    e.target.value = '';
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; editing = null; render(); });
open().then(load).then(render);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
